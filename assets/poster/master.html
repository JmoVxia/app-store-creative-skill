<!doctype html><html><meta charset="utf-8"><title>海报母版</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden}body{position:relative}.card{position:absolute;background:white;isolation:isolate}.card:after{content:"";position:absolute;inset:0;border:1px solid var(--paper-border);border-radius:inherit;pointer-events:none;z-index:3}.image{position:absolute;display:block;object-fit:contain}.badge{position:absolute;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;z-index:4}.label{position:absolute;text-align:center;font-weight:600;white-space:nowrap}.step-title{position:absolute;font-weight:600;white-space:nowrap}.arrow{position:absolute;z-index:5}.header{position:absolute;display:block;left:0;top:0}.title{position:absolute;left:48px;right:48px;text-align:center;margin:0;font-weight:750;line-height:1.14;letter-spacing:-2px}.title span{display:block;white-space:nowrap}.subtitle{position:absolute;left:48px;right:48px;text-align:center;margin:0;font-weight:600;white-space:nowrap}
</style><body><script>
const s=/*POSTER_SPEC*/ null,t=s.tokens,d=s.device;document.documentElement.lang=s.locale;Object.assign(document.body.style,{width:s.canvas[0]+'px',height:s.canvas[1]+'px',background:t.background,color:t.ink,fontFamily:t.fontFamily});document.documentElement.style.setProperty('--paper-border',t.paperBorder);
const rect=(e,r)=>Object.assign(e.style,{left:r[0]+'px',top:r[1]+'px',width:r[2]+'px',height:r[3]+'px'});
function node(tag,cls,name,r,parent=document.body){const e=document.createElement(tag);e.className=cls;if(name)e.dataset.component=name;if(r)rect(e,r);parent.append(e);return e}
function label(tag,cls,name,r,value,parent){const e=node(tag,cls,name,r,parent);e.textContent=value;e.dataset.ascText='';return e}
if(s.header.image){const e=node('img','header','header',[0,0,s.canvas[0],d.headerHeight]);e.src=s.header.image;e.dataset.ascEssential=''}else{const h=node('h1','title','title',s.header.titleRect);h.style.fontSize=t.titleFont+'px';h.dataset.ascText='';h.dataset.ascEssential='';for(const line of s.header.title){const span=document.createElement('span');span.textContent=line;h.append(span)}const sub=label('p','subtitle','subtitle',s.header.subtitleRect,s.header.subtitle);sub.style.fontSize=t.subtitleFont+'px';sub.style.lineHeight='1.2';sub.style.color=t.muted;sub.dataset.ascEssential=''}
for(let i=0;i<2;i++){const e=label('div','label','label-'+i,s.labelRects[i],s.labels[i]);e.style.fontSize=d.labelFont+'px';e.style.lineHeight=d.labelHeight+'px';e.style.color=t.muted;e.dataset.ascEssential=''}
for(const c of s.cards){const e=node('section','card',c.name,c.rect);e.dataset.ascEssential='';e.style.borderRadius=t.paperRadius+'px';e.style.boxShadow=t.paperShadow;const r=c.imgRect,img=node('img','image',c.name+'-image',[r[0]-c.rect[0],r[1]-c.rect[1],r[2],r[3]],e);img.src=c.image;img.dataset.ascEssential='';if(c.badge!==undefined){const b=label('div','badge',c.name+'-badge',[t.paperPadding,t.paperPadding,t.badgeSize,t.badgeSize],c.badge,e);Object.assign(b.style,{background:t.accent,borderRadius:t.badgeRadius+'px',fontSize:t.badgeFont+'px'});b.dataset.ascEssential=''}if(c.stepTitle){const r=[t.paperPadding+t.badgeSize+t.badgeGap,t.paperPadding,d.cardWidth-2*t.paperPadding-t.badgeSize-t.badgeGap,t.stepTitleHeight],h=label('div','step-title',c.name+'-title',r,c.stepTitle,e);h.style.fontSize=(d.stepTitleFont??t.stepTitleFont)+'px';h.style.lineHeight=t.stepTitleHeight+'px';h.dataset.ascEssential=''}}
const a=node('div','arrow','arrow',s.arrowRect),w=s.arrowRect[2],h=s.arrowRect[3],stem=t.arrowShaft,head=t.arrowHeadWidth;a.dataset.ascEssential='';a.innerHTML='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path fill="'+t.accent+'" d="M '+(stem/2)+' '+((h-stem)/2)+' H '+(w-head)+' V 0 L '+w+' '+(h/2)+' L '+(w-head)+' '+h+' V '+((h+stem)/2)+' H '+(stem/2)+' A '+(stem/2)+' '+(stem/2)+' 0 0 1 '+(stem/2)+' '+((h-stem)/2)+' Z"/></svg>';
(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const ready=node('div');ready.id='poster-ready';ready.style.cssText='position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none'})();
</script></body></html>
